# Nexus DB — Per-Database Schema
# =============================================================================
# Nexus = Transformation = the contact boundary (HoloOS doc 00.md §2.1, 02.1 §5)
# "A state-transition event that forces the identity-pattern to reorganize or
# fail." / "The Contact Boundary is the selectively permeable nexus where the
# Matrix and Potentiator interact."
#
# The Nexus DB holds 4 of the 8 functional roles:
#   - Catalyst        (currency — unprocessed pressure entering)
#   - Experience      (currency — processed update exiting)
#   - Transformation  (the contact-boundary ITSELF — the threshold event)
#   - Choice          (currency — directional output emitted into Great Way)
#
# Cycle: both  |  Scale: inter-holonic  |  Dimension: both
# Currency In: all  |  Currency Out: all
# Entry-Type property: "Category" (select)
# Currency property: "Kind" (select: Catalyst/Experience/Transformation/Choice)
#
# v0.9.0 RELOCATIONS INTO Nexus (per user directive):
#   - Note                  ← Potentiator (raw notes are Catalyst-class currency)
#   - Knowledge-Category    ← Potentiator (digested notes are Experience-class currency)
#   - Reflection            ← (already in Nexus, tag as Experience)
#   - Insight               ← (already in Nexus, tag as Catalyst)
#   - Pattern               ← (already in Nexus, tag as Transformation — recurring threshold)
#   - Strength              → Matrix.Foundation (per Flag 1 — RELOCATED OUT)
#   - Threshold             → Matrix.Threshold (per Flag 1 — RELOCATED OUT if Matrix-class)
#
# The `Kind` property (already in the existing config) distinguishes which of
# the 4 currencies a given Nexus entry is carrying. The mutate.rs validator
# (already implemented) enforces that Kind constrains which inter-DB relations
# can be populated — see universal/holon_coordinate.yaml validation_rule
# nexus_kind_consistency.

schema_version: "0.9.0"
schema_type: per_db
applies_to_db: nexus

properties:
  kind:
    notion_type: select
    required: true
    description: |
      Currency being transmuted through this Nexus entry (HoloOS doc 03.1 §2.3).
      The 4 currencies flow through specific reservoirs:
        - Catalyst        flows Potentiator → Matrix  (lesser cycle)
        - Experience      flows Matrix → Potentiator  (lesser cycle)
        - Transformation  flows GreatWay → Significator (greater cycle)
        - Choice          flows Significator → GreatWay (greater cycle)
      Constrains which inter-DB relations may be populated — see validation_rule
      nexus_kind_consistency in universal/holon_coordinate.yaml.
    options:
      - Catalyst
      - Experience
      - Transformation
      - Choice

  gamma_tensor:
    notion_type: rich_text
    required: false
    description: |
      Γ = (Ag, Cm, Er, Agp) — the 4-vector coupling tensor (HoloOS doc 08.1 §3.4,
      08.5 §3). Configured by the 4 drives. Encoded as JSON in a Notion rich_text.
      This is the structural shape of the contact boundary for this entry.

  boundary_permeability:
    notion_type: number
    required: false
    description: |
      Cm / (Ag + ε) — horizontal permeability of the contact boundary (HoloOS doc 08.5 §3.1).
      Range: 0.0 (fully sealed) – 1.0 (fully open).

  vertical_balance_BV:
    notion_type: number
    required: false
    description: |
      min(Er, Agp) / max(Er, Agp) — vertical drive balance (HoloOS doc 08.5 §3.2).
      Range: 0.0 (imbalanced) – 1.0 (perfectly balanced Eros↔Agape).

  horizontal_balance_BH:
    notion_type: number
    required: false
    description: |
      min(Az, Cz) / max(Az, Cz) — horizontal drive balance (HoloOS doc 02.1 §6.2).
      Range: 0.0 (imbalanced) – 1.0 (perfectly balanced Agency↔Communion).

  transformation_threshold:
    notion_type: number
    required: false
    description: |
      T_thresh — the threshold the Significator must reach for this Nexus
      entry (Transformation-kind) to fire (HoloOS doc 03.1 §3 stage 8).
      Default: 110.0 (from lifeos.config.default.json nexus_firing.pressure_threshold).

  crucible_intensity:
    notion_type: select
    required: false
    description: |
      Per HoloOS doc holon_states.yaml greater_cycle.preconditions.
      Used only for Transformation-kind Nexus entries.
    options:
      - moderate
      - acute

  choice_polarity:
    notion_type: select
    required: false
    description: |
      STO/STS polarity of an emitted Choice (HoloOS doc 02.4 §2.3).
      Used only for Choice-kind Nexus entries.
    options:
      - STO        # Service-to-Others — donor radiative polarity
      - STS        # Service-to-Self — acceptor absorptive polarity
      - neutral    # Uncommitted — pre-polarization

  crystallization_ratio:
    notion_type: number
    required: false
    description: |
      Per HoloOS doc holon_states.yaml greater_cycle.preconditions.
      Min 0.7 required for `choice-locked` greater-cycle phase.
      Used only for Choice-kind Nexus entries.
      Range: 0.0–1.0.

  # ── Note & Knowledge-Category specific (relocated v0.9.0) ──
  source_url:
    notion_type: url
    required: false
    description: |
      For Note-kind entries (relocated from Potentiator): the original URL
      where this Catalyst-class note was sourced from.

  knowledge_synthesis_state:
    notion_type: select
    required: false
    description: |
      For Knowledge-Category entries (relocated from Potentiator): tracks the
      9-stage digestion state of a knowledge atom as it crystallizes from
      Catalyst-class Note into Experience-class Knowledge into refined Catalyst.
    options:
      - raw_note           # stage 1-2: just captured, unprocessed
      - annotated          # stage 3-4: highlighted, digested once
      - synthesized        # stage 5-6: integrated into knowledge category
      - applied            # stage 7-9: integrated into Significator, driving Choice

relations:
  - name: "Counterpart"
    target_db: nexus
    direction: dual_property
    dual_backlink: "Counterpart"
    cardinality: one_to_one
    description: |
      Pairs a Catalyst-kind entry with its resulting Experience-kind entry,
      or a Transformation-kind entry with its resulting Choice-kind entry.
      The dual nature of the contact boundary: every input has an output.

  - name: "Counter-Synthesis"
    target_db: nexus
    direction: dual_property
    dual_backlink: "Counter-Synthesis"
    cardinality: many_to_many
    description: |
      Antithetical pairing — two Nexus entries that represent opposite
      polarities of the same threshold event.

  - name: "Reinforces"
    target_db: nexus
    direction: dual_property
    dual_backlink: "Reinforced By"
    cardinality: many_to_many
    description: |
      One Nexus entry amplifies the effect of another (e.g. two Catalysts
      that compound, or two Transformations that fire together).

  - name: "Sub-event"
    target_db: nexus
    direction: dual_property
    dual_backlink: "Parent-event"
    cardinality: one_to_many
    description: Fractal nesting of contact-boundary events.

inter_db_relations:
  - name: "Updates"
    target_db: matrix
    direction: dual_property
    dual_backlink: "Updated By"
    cardinality: many_to_many
    description: |
      HoloOS doc 02.1 §1: This Nexus entry (Catalyst-kind) is the carrier for
      a Catalyst flowing INTO the linked Matrix entry.

  - name: "Sourced From"
    target_db: potentiator
    direction: dual_property
    dual_backlink: "Sources To (Nexus)"
    cardinality: many_to_many
    description: |
      HoloOS doc 02.1 §1: This Nexus entry (Catalyst-kind OR Experience-kind)
      was sourced from the linked Potentiator entry.

  - name: "Tension"
    target_db: significator
    direction: dual_property
    dual_backlink: "Tension Held By"
    cardinality: many_to_many
    description: |
      HoloOS doc 03.1 §3 stage 8: This Nexus entry (Transformation-kind) is the
      threshold-event carrier acting ON the linked Significator entry.

  - name: "Counter-Tension"
    target_db: greatway
    direction: dual_property
    dual_backlink: "Counter-Tension From"
    cardinality: many_to_many
    description: |
      HoloOS doc 03.1 §3 stage 8: This Nexus entry (Transformation-kind OR
      Choice-kind) is being shaped by pressure from the linked GreatWay entry.

  - name: "Rewrites (Matrix)"
    target_db: matrix
    direction: dual_property
    dual_backlink: "Rewritten By"
    cardinality: many_to_many
    description: |
      HoloOS doc 03.1 §3 stage 9: After Transformation fires, this Nexus entry
      drives the downward rewrite of the linked Matrix entry.

  - name: "Rewrites (Potentiator)"
    target_db: potentiator
    direction: dual_property
    dual_backlink: "Rewritten By"
    cardinality: many_to_many
    description: |
      HoloOS doc 03.1 §3 stage 9: After Transformation fires, this Nexus entry
      drives the downward rewrite of the linked Potentiator entry.

  - name: "Sends Catalyst To (Matrix)"
    target_db: matrix
    direction: dual_property
    dual_backlink: "Receives Catalyst From"
    cardinality: many_to_many
    description: |
      HoloOS doc 02.1 §1: A Catalyst-kind Nexus entry carries Catalyst to a
      Matrix entry. (This is a more semantically-typed alias for `Updates`.)

  - name: "Sends Experience To (Potentiator)"
    target_db: potentiator
    direction: dual_property
    dual_backlink: "Receives Experience From"
    cardinality: many_to_many
    description: |
      HoloOS doc 02.1 §1: An Experience-kind Nexus entry carries Experience
      to a Potentiator entry. (More semantically-typed alias for `Sourced From`.)

  - name: "Sends Catalyst To (Significator)"
    target_db: significator
    direction: dual_property
    dual_backlink: "Receives Catalyst From (Great Way)"
    cardinality: many_to_many
    description: |
      HoloOS doc 02.2 §2: A Catalyst-kind Nexus entry carries Great-Way-origin
      Catalyst to a Significator entry.

  - name: "Emits Choice To"
    target_db: greatway
    direction: dual_property
    dual_backlink: "Receives Choice From"
    cardinality: many_to_many
    description: |
      HoloOS doc 03.1 §3 stage 9: A Choice-kind Nexus entry carries Choice
      into the Great Way.

entry_types:
  # ── Existing Nexus entry-types (kept as-is, semantically re-typed) ──
  - Opportunity       # Catalyst-kind — emerging possibility requiring response
  - Insight           # Catalyst-kind — sudden perception of pattern
  - Reflection        # Experience-kind — processed insight, integrated learning
  - Integration       # Experience-kind — synthesis of multiple reflections
  - Pattern           # Transformation-kind — recurring threshold pattern
  - Risk              # Catalyst-kind — anticipated perturbation
  - Directive         # Choice-kind — emitted strategic direction

  # ── RELOCATED FROM Potentiator (per user directive v0.9.0) ──
  - Note                       # Catalyst-kind — raw captured note
  - Knowledge-Category         # Experience-kind — digested, categorized knowledge
  - Knowledge-Atom             # Experience-kind — single synthesized knowledge unit

  # ── RELOCATED FROM GreatWay (per Flag 3 — decisions are Choices) ──
  - Decision                   # Choice-kind — emitted decision
  - Crisis                     # Transformation-kind — acute threshold event
  - Transformation-Event       # Transformation-kind — named macro-transition

default_archetype_mapping:
  Opportunity:           { archetype_role: "Catalyst",       complex: "Mind" }
  Insight:               { archetype_role: "Catalyst",       complex: "Mind" }
  Reflection:            { archetype_role: "Experience",     complex: "Mind" }
  Integration:           { archetype_role: "Experience",     complex: "Spirit" }
  Pattern:               { archetype_role: "Transformation", complex: "Mind" }
  Risk:                  { archetype_role: "Catalyst",       complex: "Body" }
  Directive:             { archetype_role: "Choice",         complex: "Mind" }
  Note:                  { archetype_role: "Catalyst",       complex: "Mind" }
  Knowledge-Category:    { archetype_role: "Experience",     complex: "Mind" }
  Knowledge-Atom:        { archetype_role: "Experience",     complex: "Mind" }
  Decision:              { archetype_role: "Choice",         complex: "Mind" }
  Crisis:                { archetype_role: "Transformation", complex: "Body" }
  Transformation-Event:  { archetype_role: "Transformation", complex: "Spirit" }
