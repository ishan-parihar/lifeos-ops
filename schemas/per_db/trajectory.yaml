schema_version: 0.9.0
schema_type: per_db
applies_to_db: trajectory
relations:
- name: Parent
  target_db: trajectory
  direction: dual_property
  dual_backlink: Children
  cardinality: one_to_many
  description: Sub-pattern containment (parent Matrix entry contains child sub-Matrix entries).
- name: Blocked By
  target_db: trajectory
  direction: dual_property
  dual_backlink: Blocks
  cardinality: many_to_many
  description: Sequential dependency — this Matrix entry cannot consolidate until the blocker does.
- name: Refines
  target_db: trajectory
  direction: dual_property
  dual_backlink: Refined By
  cardinality: many_to_many
  description: One Matrix sub-pattern refines another (e.g. a specialized practice refines a base practice).
- name: Supersedes
  target_db: trajectory
  direction: dual_property
  dual_backlink: Superseded By
  cardinality: many_to_many
  description: Newer version of a Matrix entry replaces an older one (e.g. v2 supersedes v1).
inter_db_relations:
- name: Accumulates Into
  target_db: profile
  direction: dual_property
  dual_backlink: Accumulated From
  cardinality: many_to_one
  description: 'HoloOS doc 03.1 §3 stage 7: S_t = S_{t-1} + w_t * e_t.

    Experience accumulates upward from Matrix into Significator.

    v0.8.0 had this as single_property — v0.9.0 adds the dual backlink.

    '
- name: Generated From
  target_db: logbook
  direction: dual_property
  dual_backlink: Generates Into
  cardinality: many_to_many
  description: 'HoloOS doc 02.1 §3 Loop B: Potentiator returns refined Catalyst to Matrix.

    The Catalyst that this Matrix entry is currently ingesting came from

    this Potentiator entry.

    '
- name: Rewritten By
  target_db: synthesis
  direction: dual_property
  dual_backlink: Rewrites (Matrix)
  cardinality: many_to_many
  description: 'HoloOS doc 03.1 §3 stage 9: After Transformation fires, the Significator

    executes a downward rewrite that reconfigures the Matrix.

    This Matrix entry was last rewritten by this Nexus (Transformation-kind) entry.

    '
- name: Receives Catalyst From
  target_db: synthesis
  direction: dual_property
  dual_backlink: Sends Catalyst To (Matrix)
  cardinality: many_to_many
  description: 'HoloOS doc 02.1 §1: Catalyst flows extra→intra through the contact boundary.

    A Nexus entry tagged `Kind: Catalyst` is the carrier for this Matrix''s input.

    '
entry_types:
- Threshold
default_archetype_mapping:
  Pattern:
    archetype_role: Matrix
    complex: Mind
  Practice:
    archetype_role: Matrix
    complex: Body
  Inventory:
    archetype_role: Matrix
    complex: Body
  Foundation:
    archetype_role: Matrix
    complex: Spirit
  Threshold:
    archetype_role: Catalyst
    complex: Mind
  Active Project:
    archetype_role: Matrix
    complex: Mind
  Habit:
    archetype_role: Matrix
    complex: Body
  Routine:
    archetype_role: Matrix
    complex: Body
