# Potentiator DB — Per-Database Schema
# =============================================================================
# Potentiator = latent-state generator (HoloOS doc 00.md §2.1)
# "The reachable possibility field that receives integrated state-update and
# returns refined future input."
#
# Cycle: lesser  |  Scale: current-stage  |  Dimension: extra-holonic
# Currency In:  Experience  |  Currency Out: Catalyst
# Entry-Type property: "Entry Type" (select)
#
# Canonical entry-types (per lifeos.config.default.json):
#   - Activity       — current observed activity / behavioral input
#   - Subjective     — inner state observation
#   - Relational     — relationship-field observation
#   - Systemic       — environmental / systems-level observation
#   - Diet           — somatic-input catalyst (Flag 1: stays, tag as Catalyst-role)
#   - Financial      — resource-input catalyst (Flag 1: stays, tag as Catalyst-role)
#   - Observation    — generic catalyst-class input (Flag 1: stays, tag as Catalyst-role)
#
# NOTE on user's relocation directive (UPGRADE_FLAGS.md + user message):
#   The user noted "Potentiator is very flat in terms of data aggregation."
#   Per the v0.9.0 plan, the Note and Knowledge-Category entry-types are
#   RELOCATED OUT of Potentiator INTO Nexus (where Catalyst/Experience
#   currencies flow through the contact boundary — see nexus.yaml).
#   Potentiator now holds ONLY entries that represent latent possibility
#   fields and crystallized future-input — not raw notes or knowledge atoms.
#
# Intra-DB hierarchy relations:
#   - Crystallizes Into → Potentiator (latent possibility crystallizes into another latent)
#   - Reveals            → Matrix (crystallized Catalyst is delivered to Matrix)
#   - Crystallized To    → Matrix (legacy alias for Reveals)
#
# Inter-DB dual_property relations added v0.9.0:
#   - Generates Into    → Matrix           ⟷  Matrix.Generated From
#   - Receives Experience From ← Nexus     ⟷  Nexus.Sends Experience To (Potentiator)
#   - Rewritten By      ← Nexus            ⟷  Nexus.Rewrites (Potentiator)

schema_version: "0.9.0"
schema_type: per_db
applies_to_db: potentiator

properties:
  eta_P:
    notion_type: number
    required: false
    description: |
      Potentiator conductance capacity η_P (HoloOS doc 03.1 §5.2).
      Fraction of ingested Experience converted into refined Catalyst.
      Range: 0.0–1.0. Below 0.3 → golden-addiction shadow active.

  potentiator_load:
    notion_type: number
    required: false
    description: |
      ℓ_P — manifold breadth (HoloOS doc 08.1 §5). How latent the Potentiator is.
      Higher = more possibility-space coverage; lower = more constrained.
      Range: 0.0–10.0.

  reachable_possibilities:
    notion_type: rich_text
    required: false
    description: |
      P_t(x_next | x_t) — transition probability manifold (HoloOS doc 03.1 §2.2).
      Free-form text or JSON describing the reachable next-states from this
      Potentiator entry's current latent state.

  golden_shadow_state:
    notion_type: select
    required: false
    description: |
      Per-complex Potentiator shadow (HoloOS doc 02.1 §4).
      Differentiates from the universal `shadow_pattern` property by isolating
      the Potentiator-specific (lesser-cycle, golden-reservoir) shadow.
    options:
      - balanced
      - golden-addiction
      - golden-allergy

  latent_basin_breadth:
    notion_type: number
    required: false
    description: |
      ‖A_P‖ — magnitude of the Potentiator attractor basin (HoloOS doc 08.1 §3.2).
      How broad the latent possibility space is.
      Range: 0.0–10.0.

  communion_drive_score:
    notion_type: number
    required: false
    description: |
      C_z — Communion drive score for this Potentiator entry (HoloOS doc 02.1 §5).
      Computed: C_z = 100 · exp(-|ln(σ_C)|), where σ_C = (P · η_P)/(|E| + ε).
      Range: 0–100. Failure mode (low C_z) = confluence.

relations:
  - name: "Crystallizes Into"
    target_db: potentiator
    direction: dual_property
    dual_backlink: "Crystallized From"
    cardinality: many_to_one
    description: |
      A raw latent possibility crystallizes into a more structured latent
      possibility (e.g. an Activity crystallizes into a Subjective pattern).
      v0.8.0 had this as single_property — v0.9.0 makes it dual.

  - name: "Sub-item"
    target_db: potentiator
    direction: dual_property
    dual_backlink: "Parent item"
    cardinality: one_to_many
    description: Fractal sub-holon containment.

inter_db_relations:
  - name: "Generates Into"
    target_db: matrix
    direction: dual_property
    dual_backlink: "Generated From"
    cardinality: many_to_many
    description: |
      HoloOS doc 02.1 §3 Loop B: Potentiator returns refined Catalyst to Matrix.
      The refined Catalyst from this Potentiator entry is currently being
      ingested by this Matrix entry.

  - name: "Receives Experience From"
    target_db: nexus
    direction: dual_property
    dual_backlink: "Sends Experience To (Potentiator)"
    cardinality: many_to_many
    description: |
      HoloOS doc 02.1 §1: Experience flows intra→extra through the contact boundary.
      A Nexus entry tagged `Kind: Experience` is the carrier for this
      Potentiator's input.

  - name: "Rewritten By"
    target_db: nexus
    direction: dual_property
    dual_backlink: "Rewrites (Potentiator)"
    cardinality: many_to_many
    description: |
      HoloOS doc 03.1 §3 stage 9: After Transformation fires, the Significator
      executes a downward rewrite that reconfigures the Potentiator.
      This Potentiator entry was last rewritten by this Nexus entry.

entry_types:
  - Activity
  - Subjective
  - Relational
  - Systemic
  - Diet
  - Financial
  - Observation
  - Goal          # relocated FROM GreatWay.Goal per Flag 3 review — goals ARE latent future-input
  - Vision        # relocated FROM GreatWay.Goal — visions ARE latent future-input
  - Aspiration    # relocated FROM GreatWay.Goal

default_archetype_mapping:
  Activity:      { archetype_role: "Potentiator", complex: "Body" }
  Subjective:    { archetype_role: "Potentiator", complex: "Mind" }
  Relational:    { archetype_role: "Potentiator", complex: "Spirit" }
  Systemic:      { archetype_role: "Potentiator", complex: "Spirit" }
  Diet:          { archetype_role: "Catalyst",    complex: "Body" }
  Financial:     { archetype_role: "Catalyst",    complex: "Body" }
  Observation:   { archetype_role: "Catalyst",    complex: "Mind" }
  Goal:          { archetype_role: "Potentiator", complex: "Mind" }
  Vision:        { archetype_role: "Potentiator", complex: "Spirit" }
  Aspiration:    { archetype_role: "Potentiator", complex: "Spirit" }
