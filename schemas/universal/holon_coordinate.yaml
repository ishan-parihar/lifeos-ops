# Universal Holon Coordinate Schema
# =============================================================================
# Applies to EVERY entry in EVERY one of the 5 LifeOS reservoirs (Matrix,
# Potentiator, Nexus, Significator, GreatWay). These properties are the
# 6-axis holonic coordinate system defined in HoloOS/_THEORY/02_Ontology/
# 02.4_Significator_Valence_and_Type.md and 08.7_Interior_Exterior_vs_
# Substrate_Superstrate.md.
#
# Hierarchy of schemas (most-general → most-specific):
#   1. universal/holon_coordinate.yaml          (this file — every entry)
#   2. per_db/<db>.yaml                          (every entry in a given DB)
#   3. per_entry_type/<db>__<entry_type>.yaml    (entries of one type in one DB)
#
# A property is required for an entry IFF it is `required: true` at ANY level
# that applies to that entry (universal → per_db → per_entry_type).
#
# Notion property types are constrained to the API-supported set:
#   title, rich_text, select, multi_select, status, date, number, checkbox,
#   people, relation, url, email, phone_number, files, formula, rollup,
#   created_time, last_edited_time, created_by, last_edited_by, unique_id, button
#
# The YAML validator (lifeos-core/src/util/yaml_schemas.rs) loads these files
# at startup and validates every mutate() / create / update operation against
# the matching schema BEFORE the Notion API call is made.

schema_version: "0.9.0"
schema_type: universal
applies_to: all_dbs
applies_to_entry_types: "*"

# ── 1. Holonic Identity (HoloOS doc 00.md §8) ──────────────────────────
# The 6-axis coordinate: ⟨O, D, S, I/E, Sub/Sup, C⟩
# Format: H.{octave}.D{density}.S{sub-density}.C{composition}.{slug}
properties:
  holon_id:
    notion_type: rich_text
    required: false
    description: |
      The 6-axis holonic coordinate (HoloOS doc 00.md §8).
      Format: H.{octave}.D{density}.S{sub-density}.C{composition}.{slug}
      Example: H.3.D2.S40.C.M.individual_ishan
      Auto-generated by `lifeos derive-id` if omitted.

  # ── 2. Semantic Typing (added v0.8.0 — auto-discovered from Notion) ──
  archetype_role:
    notion_type: select
    required: true
    description: |
      The 8 functional roles (HoloOS doc 00.md §2.1, 03.1 §1).
      Identifies which of the 8 metabolic operators this entry instantiates.
    options:
      - Matrix          # M — current-state organizer
      - Potentiator     # P — latent-state generator
      - Catalyst        # C — unprocessed pressure (currency, lives in Nexus)
      - Experience      # E — processed update (currency, lives in Nexus)
      - Significator    # S — persistent identity-pattern
      - Transformation  # T — state-transition event (Nexus = contact boundary)
      - Great Way       # G — operating environment
      - Choice          # Ch — directional output (currency, lives in Nexus)

  complex:
    notion_type: select
    required: true
    description: |
      The 4 complex options (HoloOS doc 04.1 §2).
      Each archetype operates on one of three substrates (Mind/Body/Spirit),
      or remains undifferentiated (None).
    options:
      - Mind    # interior-extreme (causal) — UL/LL access — doc 04.2.1
      - Body    # exterior-extreme (gross) — UR/LR access — doc 04.2.2
      - Spirit  # individual↔collective seam — UL↔LL bridge — doc 04.2.3
      - None    # undifferentiated single M·P·C·E loop — doc 04.1 §5.1

  drive_activation:
    notion_type: multi_select
    required: false
    description: |
      The 4 drives (HoloOS doc 02.1 §5). Each drive operates at BOTH contact
      boundaries (Matrix⇌Potentiator AND Significator⇌GreatWay) — doc 02.2 §4.
      Multi-select: tag with whichever drives are currently active for this entry.
    options:
      - Agency     # A_z — boundary resistance — Matrix pole — failure: isolation
      - Communion  # C_z — field conductance — Potentiator pole — failure: confluence
      - Eros       # P_z — vertical ascent — contact-boundary gradient — failure: inflation
      - Agape      # G_z — vertical descent — closed-cycle efficiency — failure: stagnation

  shadow_pattern:
    notion_type: select
    required: false
    description: |
      The 5 shadow patterns (HoloOS doc 02.1 §4 + 02.2 §3 Sinkhole).
      4 lesser-cycle shadows + the greater-cycle Sinkhole of Indifference.
      Per HoloOS doc 03.1 §9, the full shadow architecture has 8 patterns
      (4 lesser + 4 greater); this property captures the most-diagnostic 5.
    options:
      - None                       # no shadow active
      - Dark-Addiction             # Matrix surplus — donor side — donor/STO-leaning
      - Dark-Allergy               # Matrix deficit — acceptor side — acceptor/STS-leaning
      - Golden-Addiction           # Potentiator surplus — donor (radiates ungrounded blueprint)
      - Golden-Allergy             # Potentiator deficit — acceptor (needs evolved Catalyst)
      - Sinkhole of Indifference   # Great Way Choice-starvation — depolarized (noble closure)

  digestion_stage:
    notion_type: select
    required: false
    description: |
      The 9 digestion stages (HoloOS doc 03.1 §3).
      Tracks an entry's position in the canonical 9-stage metabolic cycle.
      Required on Nexus entries (where the cycle actually transmutes);
      optional on the 4 reservoirs (where stages are projected/snapshotted).
    options:
      - "1 - Latent State"               # (M_t, P_t) at rest
      - "2 - Boundary Contact"           # c_in = B(c_env; Ag, Cm)
      - "3 - Matrix Ingestion"           # M_t ⊕ c_in
      - "4 - Matrix Digestion"           # e_t = Digest(M_t, c_in; η_M)
      - "5 - Potentiator Ingestion"      # P_t ⊕ e_t
      - "6 - Potentiator Digestion"      # c'_{t+1} = Potentiate(P_t, e_t; η_P, Er, Agp)
      - "7 - Significator Accumulation"  # S_t = S_{t-1} + w_t * e_t
      - "8 - Transformation Threshold"   # f(G_t, P_t, S_t) > T_thresh → Trigger T_t
      - "9 - Choice & Rewrite"           # Ch_t = Choice(S_t, T_t; η_S) → rewrites M, P

  holon_type:
    notion_type: select
    required: false
    description: |
      The 5 holon types (HoloOS doc 02.3 §2, 02.4 §2.3).
      Type = the Significator's invariant bonding-disposition toward the Great Way.
      Computed by `lifeos derive-type` from the Valence Signature YAML.
      Type ⊥ Stage (HoloOS doc 4_Type_Validation_Protocol.md §2) — they are independent.
    options:
      - Donor        # open, addiction-side — STO-leaning, radiative — Group 1 analog
      - Acceptor     # open, allergy-side — STS-leaning, absorptive — Group 17 analog
      - Sharer       # balanced (high G_z, matched ports) — covalent-capable — Group 14 analog
      - Multivalent  # several simultaneous open registers — transition-metal analog
      - Noble        # closed (no deficit at this octave) — Group 18 analog — graduated OR sinkhole

  valence_signature:
    notion_type: rich_text
    required: false
    description: |
      The per-complex register profile (HoloOS doc 02.4 §3).
      Format: YAML-encoded string in a Notion rich_text property.
      𝒱 = ⟨ d ; { (c, ρ_c, σ_c) }_{c ∈ active complexes} ⟩
      Generated by `lifeos valence-signature --page-id <id>`.
      Consumed by `lifeos derive-type --page-id <id>` to compute holon_type.
      Required on Significator entries (where the valence shell lives).

  # ── 3. Cycle Position (HoloOS doc 08.7, holon_states.yaml) ──
  lesser_cycle_phase:
    notion_type: select
    required: false
    description: |
      The 6 lesser-cycle phases (HoloOS doc holon_states.yaml).
      Tracks the Matrix⇌Potentiator metabolism state.
    options:
      - dormant                   # at rest, no catalysts in flight
      - ingesting                 # catalyst entering Matrix
      - processing-skewed         # Matrix digesting, skewed by surplus/deficit
      - processing-integrated     # Matrix digesting, balanced
      - integrating               # Experience flowing into Potentiator
      - quiescent                 # post-integration, awaiting next catalyst

  greater_cycle_phase:
    notion_type: select
    required: false
    description: |
      The 9 greater-cycle phases (HoloOS doc holon_states.yaml).
      Tracks the Significator⇌GreatWay metabolism state.
    options:
      - significator-forming
      - significator-stable
      - transformation-pre-crucible
      - transformation-crucible
      - transformation-reintegration
      - great-way-aligned
      - great-way-friction
      - choice-polarizing
      - choice-locked

  # ── 4. Coordinates (HoloOS doc 00.md §8, type_codes/scale_codes) ──
  scale_code:
    notion_type: select
    required: false
    description: |
      Organizational scale (HoloOS doc scale_codes.yaml, S00–S80).
      Examples: S00=quantum, S10=individual, S23=family, S40=organization,
      S50=institution, S60=community, S70=civilization, S80=planetary.
      Required for entries that participate in the fractal nesting hierarchy.
    options:
      - S00  # quantum / sub-atomic
      - S10  # individual (single human)
      - S11  # individual interior (psychology)
      - S20  # pair / dyad
      - S23  # family
      - S31  # small group / team
      - S40  # organization
      - S50  # institution
      - S60  # community / movement
      - S70  # civilization / society
      - S80  # planetary / species

  stage_code:
    notion_type: select
    required: false
    description: |
      Developmental stage (HoloOS doc stage_codes.yaml, L1–L8).
      Spiral Dynamics derived: L1=Beige, L2=Purple, ..., L8=Turquoise.
      Stage ⊥ Type — they are independent (HoloOS doc 4_Type_Validation_Protocol.md §2).
    options: [L1, L2, L3, L4, L5, L6, L7, L8]

  type_code:
    notion_type: select
    required: false
    description: |
      Concrete holon type taxonomy (HoloOS doc type_codes.yaml, T01–T51).
      51 taxonomic categories (T01=Polity, T13=Person, T19=Identity_Group, ...).
      Different from `holon_type` (the 5 valence-class types).
      See HoloOS/_INSTRUMENTS/schemas/taxonomy/type_codes.yaml for the full list.
    options:
      - T01  # Polity
      - T02  # Economy
      - T03  # Market
      - T04  # Industry
      - T05  # Firm
      - T06  # Network
      - T07  # Platform
      - T08  # Infrastructure
      - T09  # Technology
      - T10  # Demographic
      - T11  # Population
      - T12  # Place
      - T13  # Person
      - T14  # Role
      - T15  # Movement
      - T16  # Ideology
      - T17  # Religion
      - T18  # Culture
      - T19  # Identity_Group
      - T20  # Class
      - T21  # Ethnicity
      - T22  # Nation
      - T23  # State
      - T24  # Government
      - T25  # Law
      - T26  # Policy
      - T27  # Treaty
      - T28  # Alliance
      - T29  # Federation
      - T30  # Organization
      - T31  # Institution
      - T32  # University
      - T33  # Religion_Org
      - T34  # NGO
      - T35  # Corporation
      - T36  # Cooperative
      - T37  # Partnership
      - T38  # Club
      - T39  # Community
      - T40  # Society
      - T41  # Civilizational_Bloc
      - T42  # Empire
      - T43  # Hegemony
      - T44  # Biome
      - T45  # Ecoregion
      - T46  # Watershed
      - T47  # Continent
      - T48  # Ocean
      - T49  # Atmosphere
      - T50  # Biosphere
      - T51  # Planetary_System

  interior_exterior:
    notion_type: select
    required: false
    description: |
      Perspective parameter (HoloOS doc 08.7 §2).
      Always both, simultaneously — this property records which face is being
      foregrounded in the current analysis.
    options:
      - Interior  # UL/LL access — subjective meaning
      - Exterior  # UR/LR access — objective behavior

  # ── 5. Coherence Metrics (HoloOS doc 02.1 §6, 08.1) ──
  gz_score:
    notion_type: number
    required: false
    description: |
      G_z — Goldilocks coherence of the lesser cycle (Matrix⇌Potentiator).
      Target > 70. HoloOS doc 02.1 §6.2.
      Range: 0-100.

  pz_score:
    notion_type: number
    required: false
    description: |
      P_z — Polarization power of the greater cycle (Significator⇌GreatWay).
      Target > 70. HoloOS doc 02.1 §6.2.
      Range: 0-100.

# ── Validation Rules (cross-property) ──────────────────────────────────
# The validator checks these AFTER individual property type checks pass.
validation_rules:
  - id: nexus_kind_consistency
    description: |
      Nexus entries tagged with `Kind: Catalyst` may only link to Matrix and
      Potentiator (lesser-cycle reservoirs); `Kind: Choice` may only link to
      Great Way; etc. Enforces the currency-flow ontology.
      (Already implemented in lifeos-core/src/tools/mutate.rs.)
    applies_to_db: nexus
    rule: |
      if entry.kind == "Catalyst":
          assert_no_relations(entry, ["Tension", "Counter-Tension"])
      elif entry.kind == "Experience":
          assert_no_relations(entry, ["Updates", "Tension", "Counter-Tension"])
      elif entry.kind == "Transformation":
          assert_no_relations(entry, ["Updates", "Sourced From"])
      elif entry.kind == "Choice":
          assert_no_relations(entry, ["Updates", "Sourced From", "Tension"])

  - id: significator_valence_signature_required
    description: |
      Significator entries MUST have a Valence Signature YAML if `holon_type`
      is set — the type is computed FROM the valence signature, so they are
      always paired. (HoloOS doc 02.4 §4.)
    applies_to_db: significator
    rule: |
      if entry.holon_type is not None:
          assert entry.valence_signature is not None
          assert entry.valence_signature parses as valid YAML
          assert "complexes" in entry.valence_signature

  - id: stage_type_independence
    description: |
      `stage_code` and `holon_type` must BOTH be set OR BOTH be empty.
      Setting only one without the other is an ontological error
      (HoloOS doc 4_Type_Validation_Protocol.md §2: "Type ⊥ Stage").
    rule: |
      assert (entry.stage_code is None) == (entry.holon_type is None)

  - id: complex_archetype_consistency
    description: |
      The (archetype_role, complex) pair must identify one of the 22 named
      archetypes (HoloOS doc 03.2 §2). E.g. (Matrix, Mind) → archetype #1.
      Complex=None is only valid with archetype_role=Choice (archetype #22).
    rule: |
      if entry.complex == "None":
          assert entry.archetype_role == "Choice"
      else:
          assert (entry.archetype_role, entry.complex) in {
              ("Matrix","Mind"),("Potentiator","Mind"),("Catalyst","Mind"),
              ("Experience","Mind"),("Significator","Mind"),
              ("Transformation","Mind"),("Great Way","Mind"),
              ("Matrix","Body"),("Potentiator","Body"),("Catalyst","Body"),
              ("Experience","Body"),("Significator","Body"),
              ("Transformation","Body"),("Great Way","Body"),
              ("Matrix","Spirit"),("Potentiator","Spirit"),("Catalyst","Spirit"),
              ("Experience","Spirit"),("Significator","Spirit"),
              ("Transformation","Spirit"),("Great Way","Spirit"),
          }
