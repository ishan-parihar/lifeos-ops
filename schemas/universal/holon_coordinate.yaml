# Universal Holon Coordinate Schema
# =============================================================================
# The minimal set of properties that apply to EVERY entry in EVERY LifeOS DB.
# These are the v0.8.0 semantic-typing properties that are actually taggable
# and operationally useful. Everything else is YAML-schema-only (validated
# client-side, not stored as Notion properties).
#
# Hierarchy: universal → per_db → per_entry_type
# A property is required IFF required:true at any applicable layer.

schema_version: "0.9.0"
schema_type: universal
applies_to: all_dbs
applies_to_entry_types: "*"

properties:
  archetype_role:
    notion_type: select
    required: true
    description: "One of 8 functional roles (HoloOS doc 00.md §2.1): Matrix, Potentiator, Catalyst, Experience, Significator, Transformation, Great Way, Choice."
    options:
      - Matrix
      - Potentiator
      - Catalyst
      - Experience
      - Significator
      - Transformation
      - Great Way
      - Choice

  complex:
    notion_type: select
    required: true
    description: "Mind/Body/Spirit/None (HoloOS doc 04.1 §2)."
    options: [Mind, Body, Spirit, None]

  drive_activation:
    notion_type: multi_select
    required: false
    description: "Active drives (HoloOS doc 02.1 §5): Agency, Communion, Eros, Agape."
    options: [Agency, Communion, Eros, Agape]

  shadow_pattern:
    notion_type: select
    required: false
    description: "5 shadow patterns (HoloOS doc 02.1 §4 + 02.2 §3)."
    options:
      - None
      - Dark-Addiction
      - Dark-Allergy
      - Golden-Addiction
      - Golden-Allergy
      - Sinkhole of Indifference

  digestion_stage:
    notion_type: select
    required: false
    description: "9-stage digestion process (HoloOS doc 03.1 §3). Populated on Nexus + Potentiator only."
    options:
      - "1 - Latent State"
      - "2 - Boundary Contact"
      - "3 - Matrix Ingestion"
      - "4 - Matrix Digestion"
      - "5 - Potentiator Ingestion"
      - "6 - Potentiator Digestion"
      - "7 - Significator Accumulation"
      - "8 - Transformation Threshold"
      - "9 - Choice & Rewrite"

  holon_type:
    notion_type: select
    required: false
    description: "5 valence-class types (HoloOS doc 02.3 §2). Populated on Significator only; derived from Valence Signature via `lifeos derive-type`."
    options: [Donor, Acceptor, Sharer, Multivalent, Noble]

validation_rules:
  - id: nexus_kind_consistency
    description: "Nexus entries tagged with Kind=Catalyst may only link to Matrix/Potentiator; Kind=Choice may only link to GreatWay; etc."
    applies_to_db: nexus
    rule: |
      if entry.kind == "Catalyst":
          assert_no_relations(entry, ["Tension", "Counter-Tension"])
      elif entry.kind == "Experience":
          assert_no_relations(entry, ["Updates", "Tension", "Counter-Tension"])
      elif entry.kind == "Transformation":
          assert_no_relations(entry, ["Updates", "Sourced From"])
      elif entry.kind == "Choice":
          assert_no_relations(entry, ["Updates", "Sourced From", "Tension"])

  - id: stage_type_independence
    description: "stage_code and holon_type must BOTH be set or BOTH be empty (HoloOS doc 4_Type_Validation_Protocol.md §2)."
    rule: |
      assert (entry.stage_code is None) == (entry.holon_type is None)

  - id: complex_archetype_consistency
    description: "The (archetype_role, complex) pair must identify one of the 22 named archetypes. Complex=None is only valid with archetype_role=Choice."
    rule: |
      if entry.complex == "None":
          assert entry.archetype_role == "Choice"
      else:
          assert (entry.archetype_role, entry.complex) in {
              ("Matrix","Mind"),("Potentiator","Mind"),("Catalyst","Mind"),
              ("Experience","Mind"),("Significator","Mind"),
              ("Transformation","Mind"),("Great Way","Mind"),
              ("Matrix","Body"),("Potentiator","Body"),("Catalyst","Body"),
              ("Experience","Body"),("Significator","Body"),
              ("Transformation","Body"),("Great Way","Body"),
              ("Matrix","Spirit"),("Potentiator","Spirit"),("Catalyst","Spirit"),
              ("Experience","Spirit"),("Significator","Spirit"),
              ("Transformation","Spirit"),("Great Way","Spirit"),
          }
