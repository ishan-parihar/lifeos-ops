[workspace]
resolver = "2"
members = [
    "lifeos-core",
    "lifeos",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Ishan Pathak <ishan@raeter.com>"]
license = "MIT"
repository = "https://github.com/ishan-parihar/lifeos-ops"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
strip = true