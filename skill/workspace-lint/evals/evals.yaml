# Eval: workspace-lint
#
# Minimal eval set for the workspace-lint skill.
# Tests core functionality: config loading, violation detection, auto-fix.

## Test 1: Clean project passes
Setup:
```
mkdir -p /tmp/test-wlint-clean/src
touch /tmp/test-wlint-clean/src/app.py
touch /tmp/test-wlint-clean/README.md
touch /tmp/test-wlint-clean/.gitignore
cat > /tmp/test-wlint-clean/workspace-lint.yaml << 'EOF'
project:
  name: test
structure:
  canonical:
    - path: src
root:
  allowed_root_files:
    - README.md
    - .gitignore
    - workspace-lint.yaml
  forbidden_files:
    - "*.log"
files: {}
directories:
  forbidden_patterns: []
EOF
```
Run:
```
python scripts/workspace_lint.py --root /tmp/test-wlint-clean
```
Expected:
- Exit code 0
- No errors in output

---

## Test 2: Build artifacts detected
Setup:
```
mkdir -p /tmp/test-wlint-artifacts/src/__pycache__
touch /tmp/test-wlint-artifacts/src/__pycache__/app.cpython-311.pyc
touch /tmp/test-wlint-artifacts/src/app.py
cat > /tmp/test-wlint-artifacts/workspace-lint.yaml << 'EOF'
project:
  name: test
structure:
  canonical:
    - path: src
root:
  allowed_root_files: []
  forbidden_files: []
files: {}
directories:
  forbidden_patterns: []
EOF
```
Run:
```
python scripts/workspace_lint.py --root /tmp/test-wlint-artifacts
```
Expected:
- Exit code 1 (errors found)
- Output contains "artifacts.detected" or "__pycache__"

---

## Test 3: Auto-fix removes artifacts
Setup: (use same as Test 2)
Run:
```
python scripts/workspace_lint.py --root /tmp/test-wlint-artifacts --fix
```
Expected:
- Exit code 0
- `__pycache__` directory no longer exists
- Output contains "[fixed] Removed"

