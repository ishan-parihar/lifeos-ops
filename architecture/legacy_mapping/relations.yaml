# Legacy LifeOS — Relational Network
# =============================================================================
# The complete graph of relations between legacy DBs. This is what the
# visualization script reads to draw the network.
#
# Edge types:
#   parent_of          — hierarchical containment (A is parent of B)
#   child_of           — inverse of parent_of (B is child of A)
#   feeds_into         — synthesis flow (upward): A's data synthesizes into B
#   informs            — soft influence: A's content influences B's direction
#   temporal_rollup    — deprecated: A rolls up into B temporally (Days→Weeks→...)
#   cross_reference    — non-hierarchical link (e.g. Project ↔ People)

version: "1.0"

# ─── Hierarchy edges (parent → child) ─────────────────────────────────────────
# These form the intra-system + inter-system hierarchy chains.
hierarchy_edges:
  # Foundational → Strategic
  - from: values_and_principles
    to: vision
    type: parent_of
    system: foundational
    description: Values/Principles inform Vision

  - from: values_and_principles
    to: annual_goals
    type: parent_of
    system: foundational→strategic
    description: Values spawn Annual-Goals

  - from: vision
    to: annual_goals
    type: parent_of
    system: foundational→strategic
    description: Vision translates into Annual-Goals

  # Strategic → Execution
  - from: annual_goals
    to: quarterly_goals
    type: parent_of
    system: strategic
    description: Annual-Goals decompose into Quarterly-Goals

  - from: quarterly_goals
    to: projects
    type: parent_of
    system: strategic→execution
    description: Quarterly-Goals decompose into Projects

  - from: projects
    to: tasks
    type: parent_of
    system: execution
    description: Projects decompose into Tasks

  - from: tasks
    to: activity_log
    type: parent_of
    system: execution→logging
    description: Tasks generate Activity-Log entries when executed

  # Synthesis pipeline → Execution (downward causation via Directives)
  - from: directives_and_risks
    to: projects
    type: parent_of
    system: strategic→execution
    description: Directives spawn corrective Projects

  - from: directives_and_risks
    to: tasks
    type: parent_of
    system: strategic→execution
    description: Directives spawn corrective Tasks

  # Relational hierarchy
  - from: communities
    to: people
    type: parent_of
    system: relational
    description: Communities contain People

  - from: people
    to: relational_journal
    type: parent_of
    system: relational→logging
    description: People are the subject of Relational-Journal entries

  # Financial hierarchy
  - from: financial_accounts
    to: financial_log
    type: parent_of
    system: financial
    description: Accounts own their transaction logs

  # Content-Creation hierarchy
  - from: campaigns
    to: content_pipeline
    type: parent_of
    system: content_creation
    description: Campaigns contain content pieces

  - from: quarterly_goals
    to: campaigns
    type: parent_of
    system: strategic→content
    description: Quarterly-Goals drive Campaigns

  - from: projects
    to: campaigns
    type: parent_of
    system: execution→content
    description: Projects can spawn Campaigns

  # 1st synthesis pipeline internal hierarchy
  - from: notes_management
    to: opportunities_and_strengths
    type: parent_of
    system: strategic
    description: Notes condense into Opportunities/Strengths

  - from: notes_management
    to: directives_and_risks
    type: parent_of
    system: strategic
    description: Notes condense into Directives/Risks

  # 1st synthesis → 2nd synthesis
  - from: opportunities_and_strengths
    to: stats
    type: feeds_into
    system: strategic→foundational
    description: Long-term Opportunities/Strengths condense into Stats traits

  - from: directives_and_risks
    to: stats
    type: feeds_into
    system: strategic→foundational
    description: Long-term Directives/Risks condense into Stats traits

  - from: opportunities_and_strengths
    to: values_and_principles
    type: feeds_into
    system: strategic→foundational
    description: Long-term insights reaffirm or revise Values/Principles

# ─── Synthesis flow edges (upward only) ───────────────────────────────────────
# Logs → 1st synthesis pipeline → 2nd synthesis pipeline
synthesis_edges:
  # Logs → 1st synthesis pipeline
  - from: activity_log
    to: opportunities_and_strengths
    type: feeds_into
    description: Activity data synthesizes into Opportunities/Strengths

  - from: activity_log
    to: directives_and_risks
    type: feeds_into
    description: Activity data synthesizes into Directives/Risks

  - from: activity_log
    to: notes_management
    type: feeds_into
    description: Activity observations become Notes

  - from: diet_log
    to: opportunities_and_strengths
    type: feeds_into
    description: Diet data synthesizes into health Opportunities/Strengths

  - from: diet_log
    to: directives_and_risks
    type: feeds_into
    description: Diet data synthesizes into health Directives/Risks

  - from: financial_log
    to: opportunities_and_strengths
    type: feeds_into
    description: Financial data synthesizes into financial Opportunities/Strengths

  - from: financial_log
    to: directives_and_risks
    type: feeds_into
    description: Financial data synthesizes into financial Directives/Risks

  - from: subjective_journal
    to: opportunities_and_strengths
    type: feeds_into
    description: Subjective insights synthesize into Opportunities/Strengths

  - from: subjective_journal
    to: directives_and_risks
    type: feeds_into
    description: Subjective insights synthesize into Directives/Risks

  - from: subjective_journal
    to: notes_management
    type: feeds_into
    description: Subjective reflections become Notes

  - from: relational_journal
    to: opportunities_and_strengths
    type: feeds_into
    description: Relational data synthesizes into relational Opportunities/Strengths

  - from: relational_journal
    to: directives_and_risks
    type: feeds_into
    description: Relational data synthesizes into relational Directives/Risks

  - from: systemic_journal
    to: opportunities_and_strengths
    type: feeds_into
    description: Systemic observations synthesize into Opportunities/Strengths

  - from: systemic_journal
    to: directives_and_risks
    type: feeds_into
    description: Systemic observations synthesize into Directives/Risks

  - from: systemic_journal
    to: notes_management
    type: feeds_into
    description: Systemic reflections become Notes

# ─── Temporal rollup edges (DEPRECATED) ───────────────────────────────────────
temporal_edges:
  # Days → Weeks → Months → Quarters → Years (deprecated)
  - from: days
    to: weeks
    type: temporal_rollup
    description: DEPRECATED — Days roll up into Weeks
  - from: weeks
    to: months
    type: temporal_rollup
    description: DEPRECATED — Weeks roll up into Months
  - from: months
    to: quarters
    type: temporal_rollup
    description: DEPRECATED — Months roll up into Quarters
  - from: quarters
    to: years
    type: temporal_rollup
    description: DEPRECATED — Quarters roll up into Years

  # Logs → Days (deprecated — each log entry has a Date now)
  - from: activity_log
    to: days
    type: temporal_rollup
    description: DEPRECATED — Activity entries roll up to Day
  - from: diet_log
    to: days
    type: temporal_rollup
    description: DEPRECATED — Diet entries roll up to Day
  - from: financial_log
    to: days
    type: temporal_rollup
    description: DEPRECATED — Financial entries roll up to Day
  - from: subjective_journal
    to: days
    type: temporal_rollup
    description: DEPRECATED — Subjective entries roll up to Day
  - from: relational_journal
    to: days
    type: temporal_rollup
    description: DEPRECATED — Relational entries roll up to Day
  - from: systemic_journal
    to: days
    type: temporal_rollup
    description: DEPRECATED — Systemic entries roll up to Day

  # Quarters ↔ Quarterly-Goals (deprecated — filters do this now)
  - from: quarters
    to: quarterly_goals
    type: cross_reference
    description: DEPRECATED — Quarters relate to Quarterly-Goals
  - from: years
    to: annual_goals
    type: cross_reference
    description: DEPRECATED — Years relate to Annual-Goals
  - from: years
    to: vision
    type: cross_reference
    description: DEPRECATED — Years relate to Vision/Values

# ─── Cross-reference edges (non-hierarchical) ─────────────────────────────────
cross_reference_edges:
  - from: projects
    to: people
    type: cross_reference
    description: Projects involve People
  - from: projects
    to: financial_accounts
    type: cross_reference
    description: Projects have budgets in Financial-Accounts
  - from: tasks
    to: people
    type: cross_reference
    description: Tasks assigned to People
  - from: campaigns
    to: people
    type: cross_reference
    description: Campaigns target/involve People
  - from: content_pipeline
    to: people
    type: cross_reference
    description: Content can feature/credit People
  - from: financial_log
    to: projects
    type: cross_reference
    description: Financial entries can be project-related

# ─── Stats cross-references (Stats is the user profile across all dimensions) ──
stats_edges:
  - from: activity_log
    to: stats
    type: feeds_into
    description: Activity trends condense into health Stats
  - from: diet_log
    to: stats
    type: feeds_into
    description: Diet trends condense into health Stats
  - from: financial_log
    to: stats
    type: feeds_into
    description: Financial trends condense into financial Stats
  - from: relational_journal
    to: stats
    type: feeds_into
    description: Relational trends condense into relational Stats
  - from: subjective_journal
    to: stats
    type: feeds_into
    description: Subjective trends condense into psychological Stats
  - from: systemic_journal
    to: stats
    type: feeds_into
    description: Systemic trends condense into execution Stats
