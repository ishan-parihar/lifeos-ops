# Legacy LifeOS — Systems Map
# =============================================================================
# The 7 functional systems + Logging-System + 2 synthesis pipelines that
# together form the complete legacy LifeOS structure.
#
# Source: user's description in conversation (2026-07-06).
# This is the canonical reference for the legacy structure.

version: "1.0"
description: >
  The legacy LifeOS was a complete system where each DB handled a particular
  function. DBs were organized by FUNCTION (not by holonic role). The 7 systems
  below span all dimensions of the user's life.

# ─── The 7 functional systems ─────────────────────────────────────────────────
systems:
  - id: foundational
    name: Foundational
    description: >
      The 2nd synthesis pipeline. Long-term trends condense into traits /
      observable-facts and generate the user's overall profile across all
      dimensions. The "who I am" layer.
    dbs: [values_and_principles, vision, stats]
    role: second_synthesis_pipeline
    receives_from: [first_synthesis_pipeline]
    informs: [user_self_understanding]

  - id: strategic
    name: Strategic
    description: >
      The 1st synthesis pipeline + goal-setting. Logs synthesize into
      Opportunities/Directives/Risks/Notes; Annual and Quarterly Goals translate
      Vision into time-bound targets.
    dbs: [annual_goals, quarterly_goals, opportunities_and_strengths, directives_and_risks]
    role: first_synthesis_pipeline + goal_setting
    receives_from: [logging_system]
    informs: [execution]

  - id: execution
    name: Execution
    description: >
      Where the work happens. Projects organize goals into deliverables; Tasks
      are the atomic units of work. Systemic-Journal captures execution-level
      reflections. Activity-Log and Diet-Log capture health metrics.
    dbs: [projects, tasks, systemic_journal, activity_log, diet_log]
    role: action
    receives_from: [strategic]
    informs: [logging_system]  # execution generates logs

  - id: relational
    name: Relational
    description: >
      The people + communities layer. People DB is a rich CRM (31 properties
      in legacy). Communities have strategic value classification. Relational
      Journal captures interaction quality.
    dbs: [people, communities, relational_journal]
    role: external_holons
    receives_from: [execution]  # projects involve people
    informs: [logging_system]

  - id: content_creation
    name: Content-Creation
    description: >
      Content production pipeline. Campaigns organize marketing efforts;
      Content-Pipeline tracks individual content pieces from idea to published.
    dbs: [campaigns, content_pipeline]
    role: production
    receives_from: [strategic]  # goals drive content
    informs: [execution]

  - id: financial_system
    name: Financial-System
    description: >
      Accounts (current state) + Logs (transactions). Financial-Log feeds into
      the 1st synthesis pipeline like the other 5 logs.
    dbs: [financial_accounts, financial_log]
    role: state + logging
    receives_from: [execution]  # work generates income/expenses
    informs: [logging_system]

  - id: temporal_aggregation
    name: Temporal-Aggregation
    description: >
      DEPRECATED in the 5-DB merge. Days → Weeks → Months → Quarters → Years
      rolled up the 6 logs into time-based aggregations. User dropped these
      because filters within existing DBs can do the work (each log entry has
      a Date; user/ai-agent filters by date range and creates reports on demand).
    dbs: [days, weeks, months, quarters, years]
    role: aggregation
    status: deprecated
    replacement: date_range_filters

# ─── The Logging-System (cross-cutting, 6 logs) ──────────────────────────────
logging_system:
  id: logging_system
  name: Logging-System
  description: >
    The 6 logs that capture objective ground-reality data. Each log belongs
    to one or more functional systems but together they form the input layer
    for the 1st synthesis pipeline. Logs are OBJECTIVE — synthesis flows
    upward from them, never downward.
  dbs: [activity_log, diet_log, financial_log, subjective_journal, relational_journal, systemic_journal]
  role: objective_data_capture
  feeds_into: [first_synthesis_pipeline]
  principle: "Logs are objective. Synthesis flows upward only."

# ─── The synthesis pipelines (upward flow) ────────────────────────────────────
synthesis_pipelines:
  - id: first_synthesis_pipeline
    name: 1st Synthesis Pipeline
    description: >
      Where logs become insights. Opportunities-and-Strengths surfaces positive
      trajectory signals. Directives-and-Risks surfaces negative trajectory
      signals + corrective actions. Notes-Management captures raw synthesis
      notes before they condense.
    dbs: [opportunities_and_strengths, directives_and_risks, notes_management]
    receives_from: [logging_system]
    feeds_into: [second_synthesis_pipeline]
    outputs:
      - insights (inform user of positive/negative trends intuitively)
      - directives (corrective actions routed through Execution-Pipeline as Projects/Tasks)

  - id: second_synthesis_pipeline
    name: 2nd Synthesis Pipeline (= Foundational)
    description: >
      Where long-term trends condense into traits/observable-facts. Stats is
      the RPG-game-like status report across all dimensions. Values/Principles
      are the user's enduring commitments. Vision is the long-term target.
    dbs: [values_and_principles, vision, stats]
    receives_from: [first_synthesis_pipeline]
    outputs:
      - user profile (Stats = current state across all dimensions)
      - value commitments (Values/Principles)
      - long-term direction (Vision)

# ─── Synthesis flow direction ────────────────────────────────────────────────
synthesis_flow:
  direction: upward_only
  description: >
    Synthesis flows UPWARD only — from objective logs, through the 1st pipeline,
    into the 2nd pipeline. New actions result from synthesis in two ways:
      (a) Intuitively — synthesis informs the user of a positive/negative trend,
          and the user decides what to do.
      (b) Execution-Pipeline — if alignment is required, synthesis generates
          Projects/Tasks to correct course.
    Synthesis NEVER flows downward (Values don't directly spawn Logs; they
    spawn Goals → Projects → Tasks, which then generate Logs through execution).
